variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [app.backend.src.ai.cover_letter]

files:
  assets/cover_letter.tex:
    type: literal
    actions: [read]
    params:
      caller: [_generate_async]
  assets/custom_template.tex:
    type: literal
    actions: [write]
    params:
      caller: [update_resume]
  assets/link_cache.txt:
    type: literal
    actions: [read]
    params:
      caller: [_cache_links, update_resume]
  assets/template_preference.txt:
    type: literal
    actions: [write]
    params:
      caller: [update_resume]
  assets/user_file.tex:
    type: literal
    actions: [read, write]
    params:
      caller: [generate, open, update_resume_with_tex, _generate_async, optimize, get_resume_skills, search_jobs]
  assets_dir:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(assets), assets_dir.mkdir]
  path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  resume_path:
    type: literal
    actions: [read]
    params:
      caller: [Path('assets/user_file.tex'), Path, open]
  template_path:
    type: literal
    actions: [read, write]
    params:
      caller: [Path('assets/cover_letter.tex'), template_path.parent.mkdir, open]
  tex_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]

processes:
  pdflatex:
    type: shell
    actions: [exec]
    args: [[-interaction=nonstopmode, '-output-directory={output_dir}', file_path]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
