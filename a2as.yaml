manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: aadya940/autoresume
    source: https://github.com/aadya940/autoresume
    branch: main
    commit: "72b1ef72"
    scope: [app/backend/src/ai/ats_optimizer.py, app/backend/src/ai/cover_letter.py, app/backend/src/ai/main.py, app/backend/src/ai/prompts.py,
      app/backend/src/ai/utils.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:30:39Z'
    url: https://a2as.org/certified/agents/aadya940/autoresume
  signatures:
    digest: sha256:m6C58smT8veS1D4y87KvlMn-Acc0VpybOlVmgzX7jjs
    key: ed25519:qEbHBluDYCgS0scCyVi0cyiftgH4MNNK8JeKoTJPInw
    sig: ed25519:_pEYLUhfL9F5UQO3gSUBimJS0Y_MI9qmPoUzpMQ_g-yfOaECgEOz5fIrRC110QhC3_UAZKY2t3FCCI4pQ6aHAQ

agents:
  agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      function: _get_runner
      instance: agent
  agent.1:
    type: instance
    models: [gemini-2.5-flash]
    params:
      function: _inject_keywords_with_llm
      instance: agent
  agent.2:
    type: instance
    models: [gemini-3-flash-preview]
    params:
      class: CoverLetterAgent
      base: LlmAgent
      name: cover_letter_agent
      description: Generates professional cover letters following Harvard guidelines
      planner: self._planner
      instance: agent
  agent.3:
    type: instance
    models: [gemini-3-flash-preview]
    params:
      class: KeywordInjectionAgent
      base: LlmAgent
      name: keyword_injection_agent
      description: Injects ATS keywords into LaTeX resumes naturally
      planner: planner
      instance: agent
  agent._extract_skills_with_llm:
    type: factory
    models: [gemini-2.5-flash]
    params:
      function: _extract_skills_with_llm
  agent.SkillExtractionAgent:
    type: class
    models: [gemini-3-flash-preview]
    params:
      class: SkillExtractionAgent
      base: LlmAgent
      name: skill_extraction_agent
      description: Extracts technical skills and tools from job descriptions
      planner: BuiltInPlanner(thinking_config=types.ThinkingConfig())
  coder_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      function: get_runner
      instance: coder_agent
  coder_agent.1:
    type: instance
    models: [gemini-3-flash-preview]
    params:
      class: LatexCoderAgent
      base: LlmAgent
      name: latex_coder_agent
      description: Updates the LaTeX code for a resume with additional information
      planner: self._planner
      instance: coder_agent

models:
  gemini-2.5-flash:
    type: default
    agents: [coder_agent.0, agent.0, agent._extract_skills_with_llm, agent.1]
  gemini-3-flash-preview:
    type: literal
    agents: [coder_agent.1, agent.2, agent.SkillExtractionAgent, agent.3]

